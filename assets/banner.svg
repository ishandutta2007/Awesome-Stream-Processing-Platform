<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="stream-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#4FACFE" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="stream-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#text-grad);
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 16px;
      fill: #94A3B8;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #E2E8F0;
    }

    /* CSS Animations for Dynamic Dynamic SVG aspect */
    @keyframes flow {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes shimmer {
      0% { opacity: 0.4; }
      50% { opacity: 0.9; }
      100% { opacity: 0.4; }
    }

    .stream-line-1 {
      stroke-dasharray: 20, 10;
      animation: flow 25s linear infinite;
    }
    .stream-line-2 {
      stroke-dasharray: 15, 12;
      animation: flow 18s linear infinite reverse;
    }
    .pulse-node {
      transform-origin: center;
      animation: pulse 3s ease-in-out infinite;
    }
    .floating-card {
      animation: float 5s ease-in-out infinite;
    }
    .shimmer-glow {
      animation: shimmer 4s ease-in-out infinite;
    }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1000" height="320" rx="16" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="2" />

  <!-- Background Decorative Grid Grid -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 40 H1000 M0 80 H1000 M0 120 H1000 M0 160 H1000 M0 200 H1000 M0 240 H1000 M0 280 H1000" />
    <path d="M100 0 V320 M200 0 V320 M300 0 V320 M400 0 V320 M500 0 V320 M600 0 V320 M700 0 V320 M800 0 V320 M900 0 V320" />
  </g>

  <!-- Glowing Stream Processing Curves -->
  <g filter="url(#glow-light)">
    <path d="M-50,260 Q 200,100 450,220 T 1050,140" fill="none" stroke="url(#stream-cyan)" stroke-width="4" class="stream-line-1" />
    <path d="M-50,80 Q 300,280 600,120 T 1050,240" fill="none" stroke="url(#stream-purple)" stroke-width="3" class="stream-line-2" />
  </g>

  <!-- Dynamic Pulsing Nodes -->
  <g filter="url(#glow-heavy)">
    <circle cx="210" cy="150" r="14" fill="#00F2FE" opacity="0.3" class="pulse-node" />
    <circle cx="210" cy="150" r="6" fill="#00F2FE" />

    <circle cx="530" cy="190" r="16" fill="#EC4899" opacity="0.3" class="pulse-node" style="animation-delay: 1s;" />
    <circle cx="530" cy="190" r="7" fill="#EC4899" />

    <circle cx="780" cy="130" r="14" fill="#8B5CF6" opacity="0.3" class="pulse-node" style="animation-delay: 2s;" />
    <circle cx="780" cy="130" r="6" fill="#8B5CF6" />
  </g>

  <!-- Content Container & Branding -->
  <g transform="translate(60, 70)">
    <!-- Header Icon -->
    <g transform="translate(0, 0)">
      <rect width="48" height="48" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="2" filter="url(#glow-light)" />
      <path d="M14 24 L22 16 L28 22 L34 14 M34 14 H28 M34 14 V20" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Main Title & Subtitle -->
    <text x="66" y="38" class="title">Awesome Stream Processing Platform</text>
    <text x="66" y="70" class="subtitle">Curated Ecosystem of Event Streaming, Continuous SQL &amp; Stateful Analytics</text>

    <!-- Key Categories / Tech Chips -->
    <g transform="translate(66, 105)">
      <!-- Chip 1: Flink -->
      <g transform="translate(0, 0)">
        <rect width="130" height="32" rx="8" fill="#1E293B" stroke="#E11D48" stroke-width="1.5" />
        <circle cx="18" cy="16" r="5" fill="#E11D48" />
        <text x="32" y="21" class="badge-text">Apache Flink</text>
      </g>
      <!-- Chip 2: Kafka -->
      <g transform="translate(142, 0)">
        <rect width="135" height="32" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
        <circle cx="18" cy="16" r="5" fill="#38BDF8" />
        <text x="32" y="21" class="badge-text">Apache Kafka</text>
      </g>
      <!-- Chip 3: RisingWave -->
      <g transform="translate(289, 0)">
        <rect width="135" height="32" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
        <circle cx="18" cy="16" r="5" fill="#10B981" />
        <text x="32" y="21" class="badge-text">RisingWave</text>
      </g>
      <!-- Chip 4: Spark Streaming -->
      <g transform="translate(436, 0)">
        <rect width="155" height="32" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />
        <circle cx="18" cy="16" r="5" fill="#F59E0B" />
        <text x="32" y="21" class="badge-text">Spark Streaming</text>
      </g>
      <!-- Chip 5: Materialize -->
      <g transform="translate(603, 0)">
        <rect width="135" height="32" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1.5" />
        <circle cx="18" cy="16" r="5" fill="#A855F7" />
        <text x="32" y="21" class="badge-text">Materialize</text>
      </g>
    </g>
  </g>
</svg>
