<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1000 320"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#070a10"/></linearGradient><linearGradient id="stream-cyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00F2FE" stop-opacity=".8"/><stop offset="50%" stop-color="#4FACFE" stop-opacity=".9"/><stop offset="100%" stop-color="#00F2FE" stop-opacity=".8"/></linearGradient><linearGradient id="stream-purple" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#A855F7" stop-opacity=".7"/><stop offset="50%" stop-color="#EC4899" stop-opacity=".9"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity=".7"/></linearGradient><linearGradient id="text-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38BDF8"/><stop offset="50%" stop-color="#818CF8"/><stop offset="100%" stop-color="#F472B6"/></linearGradient><filter id="glow-light" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="glow-heavy" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes flow{0%{stroke-dashoffset:1000}}@keyframes pulse{0%{transform:scale(1);opacity:.8}50%{transform:scale(1.15);opacity:1}}@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes shimmer{0%{opacity:.4}50%{opacity:.9}}.title{font-weight:800;font-size:42px;fill:url(#text-grad);letter-spacing:-.5px}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle{font-weight:500;font-size:16px;fill:#94a3b8;letter-spacing:.5px}.badge-text{font-weight:600;font-size:12px;fill:#e2e8f0